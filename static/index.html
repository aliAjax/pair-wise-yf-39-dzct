<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>野生动物疫病监测与离线同步</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 880px; margin: auto; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    textarea { width: 100%; box-sizing: border-box; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
    input, select { padding: .35rem .5rem; }
    button { padding: .5rem .8rem; cursor: pointer; }
    section { border: 1px solid #e5e7eb; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
    h2 { margin-top: 0; }
    .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: .5rem 0; }
    .ok { color: #047857; font-weight: 600; }
    .bad { color: #b91c1c; font-weight: 600; }
  </style>
</head>
<body>
<main>
  <h1>野生动物疫病监测与离线同步</h1>

  <section>
    <h2>巡护批次回传</h2>
    <p>同一设备批次号重复提交会沿用第一次的应答；事件号与观察日期相同即同一条，内容相同跳过，内容不同则整批退回并列出服务器版本。</p>
    <div class="row">
      <label>身份 <select id="role">
        <option value="field">field（巡护员）</option>
        <option value="admin">admin</option>
        <option value="lab">lab</option>
        <option value="epidemiologist">epidemiologist</option>
        <option value="viewer">viewer</option>
      </select></label>
      <label>用户 <input id="userId" value="ranger-01"></label>
    </div>
    <textarea id="batchBody" rows="14">{
  "device_id": "D-001",
  "batch_no": "B-20260925-01",
  "observations": [
    {"event_id": "E-101", "species": "麋鹿", "location": "北湖岸", "observed_at": "2026-09-24", "lat": 30.12, "lon": 120.34},
    {"event_id": "E-102", "species": "白鹭", "location": "芦苇荡", "observed_at": "2026-09-24", "lat": 30.13, "lon": 120.36}
  ]
}</textarea>
    <p class="row">
      <button onclick="submitBatch()">提交批次 POST /api/batches</button>
    </p>
  </section>

  <section>
    <h2>查询批次结果</h2>
    <div class="row">
      <label>设备号 <input id="qDevice" value="D-001"></label>
      <label>批次号 <input id="qBatch" value="B-20260925-01"></label>
      <button onclick="getBatch()">查询 GET /api/batches/&lt;device&gt;/&lt;batch&gt;</button>
      <button onclick="checkHealth()">健康检查</button>
    </div>
  </section>

  <pre id="result">等待操作</pre>

  <h2>其他接口</h2>
  <pre>GET  /api/&lt;kind&gt;
POST /api/&lt;kind&gt;
GET  /api/entities/&lt;id&gt;
POST /api/entities/&lt;id&gt;/actions
GET  /api/audit</pre>
</main>
<script>
function actorHeaders() {
  return {
    'Content-Type': 'application/json',
    'X-User-Id': document.getElementById('userId').value || 'anonymous',
    'X-Role': document.getElementById('role').value
  };
}

function render(status, payload) {
  const node = document.getElementById('result');
  const label = status < 300 ? 'HTTP ' + status + ' ✓' : 'HTTP ' + status + ' ✗';
  node.textContent = label + '\n' + JSON.stringify(payload, null, 2);
}

async function submitBatch() {
  let body;
  try {
    body = JSON.parse(document.getElementById('batchBody').value);
  } catch (err) {
    render(400, {error: 'JSON 格式错误: ' + err.message});
    return;
  }
  const response = await fetch('/api/batches', {
    method: 'POST',
    headers: actorHeaders(),
    body: JSON.stringify(body)
  });
  render(response.status, await response.json());
}

async function getBatch() {
  const device = encodeURIComponent(document.getElementById('qDevice').value);
  const batch = encodeURIComponent(document.getElementById('qBatch').value);
  const response = await fetch('/api/batches/' + device + '/' + batch);
  render(response.status, await response.json());
}

async function checkHealth() {
  const response = await fetch('/health');
  render(response.status, await response.json());
}
</script>
</body>
</html>
