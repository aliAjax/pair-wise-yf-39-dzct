<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巡护批次回传 · 野生动物疫病监测</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #1f2937; }
    main { max-width: 900px; margin: auto; }
    fieldset { border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 1.2rem; }
    legend { font-weight: 600; padding: 0 .4rem; }
    label { display: inline-block; margin: .3rem .6rem .3rem 0; }
    input, textarea, select { font: inherit; padding: .35rem .5rem; border: 1px solid #9ca3af; border-radius: 6px; }
    textarea { width: 100%; box-sizing: border-box; min-height: 220px; font-family: ui-monospace, Menlo, monospace; }
    .row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }
    button { padding: .5rem .9rem; cursor: pointer; border-radius: 6px; border: 1px solid #2563eb; background: #2563eb; color: #fff; }
    button.secondary { background: #fff; color: #2563eb; }
    pre { background: #f3f4f6; padding: 1rem; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; }
    .ok { color: #047857; font-weight: 600; }
    .bad { color: #b91c1c; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; font-size: .9rem; }
    th, td { border: 1px solid #d1d5db; padding: .35rem .5rem; text-align: left; }
  </style>
</head>
<body>
<main>
  <h1>巡护队离线观察 · 批次回传</h1>

  <fieldset>
    <legend>请求身份</legend>
    <label>用户 <input id="user" value="patrol-01"></label>
    <label>角色
      <select id="role">
        <option value="field" selected>field（巡护员）</option>
        <option value="admin">admin</option>
        <option value="viewer">viewer</option>
      </select>
    </label>
  </fieldset>

  <fieldset>
    <legend>批次</legend>
    <div class="row">
      <label>设备号 <input id="device" value="DEV-07"></label>
      <label>批次号 <input id="batch" value="B-20260925-01"></label>
      <button class="secondary" type="button" onclick="fillExample()">填入示例</button>
    </div>
    <p style="margin:.6rem 0 .2rem">观察列表（JSON 数组；同一 <code>event_id</code> + <code>observed_at</code> 视为同一条）：</p>
    <textarea id="observations"></textarea>
    <p class="row" style="margin-top:.6rem">
      <button type="button" onclick="submitBatch()">提交批次</button>
      <span id="status-line"></span>
    </p>
  </fieldset>

  <h2>批次结果</h2>
  <div id="result-panel"><pre>尚未提交</pre></div>

  <h2>查询已回传批次</h2>
  <div class="row">
    <label>设备号 <input id="q-device" value="DEV-07"></label>
    <label>批次号 <input id="q-batch" value="B-20260925-01"></label>
    <button type="button" onclick="queryBatch()">查询</button>
  </div>
  <pre id="query-result">—</pre>

  <h2>服务器上的观察</h2>
  <p><button class="secondary" type="button" onclick="loadObservations()">刷新</button></p>
  <div id="obs-table"><pre>—</pre></div>
</main>
<script>
const EXAMPLE = [
  {event_id: "E-101", observed_at: "2026-09-24", species: "麋鹿", location: "北湖", lat: 30.01, lon: 120.01},
  {event_id: "E-102", observed_at: "2026-09-24", species: "白鹤", location: "东滩", lat: 30.05, lon: 120.10}
];

function headers() {
  return {"Content-Type": "application/json", "X-User-Id": userEl().value, "X-Role": roleEl().value};
}
function userEl() { return document.getElementById("user"); }
function roleEl() { return document.getElementById("role"); }

function fillExample() {
  document.getElementById("observations").value = JSON.stringify(EXAMPLE, null, 2);
}

function parseObservations() {
  const raw = document.getElementById("observations").value;
  try {
    const value = JSON.parse(raw);
    if (!Array.isArray(value)) throw new Error("观察列表必须是 JSON 数组");
    return value;
  } catch (err) {
    document.getElementById("status-line").innerHTML =
      '<span class="bad">JSON 解析失败：' + err.message + "</span>";
    return null;
  }
}

function renderBatchResult(status, payload) {
  const line = document.getElementById("status-line");
  if (payload.result === "accepted") {
    line.innerHTML = '<span class="ok">HTTP ' + status + ' · 整批接收（新增 ' +
      payload.summary.created + "，跳过 " + payload.summary.skipped + "）</span>";
  } else if (payload.result === "rejected") {
    line.innerHTML = '<span class="bad">HTTP ' + status + " · 整批退回，冲突 " +
      payload.summary.conflicts + " 项（本批未写入任何观察）</span>";
  } else {
    line.textContent = "HTTP " + status;
  }
  document.getElementById("result-panel").innerHTML =
    "<pre>" + JSON.stringify(payload, null, 2) + "</pre>";
}

async function submitBatch() {
  document.getElementById("status-line").textContent = "提交中…";
  const observations = parseObservations();
  if (observations === null) return;
  const body = {
    device_id: document.getElementById("device").value,
    batch_no: document.getElementById("batch").value,
    observations
  };
  const response = await fetch("/api/observation-batches", {
    method: "POST", headers: headers(), body: JSON.stringify(body)
  });
  renderBatchResult(response.status, await response.json());
  loadObservations();
}

async function queryBatch() {
  const params = new URLSearchParams({
    device_id: document.getElementById("q-device").value,
    batch_no: document.getElementById("q-batch").value
  });
  const response = await fetch("/api/observation-batches?" + params.toString());
  document.getElementById("query-result").textContent =
    JSON.stringify(await response.json(), null, 2);
}

async function loadObservations() {
  const response = await fetch("/api/observations");
  const payload = await response.json();
  const items = payload.items || [];
  if (!items.length) {
    document.getElementById("obs-table").innerHTML = "<pre>暂无观察</pre>";
    return;
  }
  const rows = items.map(item => "<tr><td>" + [
    item.id, item.data.event_id, item.data.observed_at, item.data.species,
    item.data.location, item.data.lat, item.data.lon, item.status, "v" + item.version
  ].map(v => String(v ?? "")).join("</td><td>") + "</td></tr>").join("");
  document.getElementById("obs-table").innerHTML =
    "<table><tr><th>ID</th><th>事件号</th><th>观察日期</th><th>物种</th>" +
    "<th>地点</th><th>纬度</th><th>经度</th><th>状态</th><th>版本</th></tr>" +
    rows + "</table>";
}

fillExample();
loadObservations();
</script>
</body>
</html>
